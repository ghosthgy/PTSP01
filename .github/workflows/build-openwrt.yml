#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
notify_server.py —— PTSP01 云编译本地通知监听器

配合 cloudflared 使用：
    python notify_server.py                     # 监听 127.0.0.1:8088
    cloudflared tunnel --url http://localhost:8088
    # cloudflared 会打印一个 https://xxx.trycloudflare.com 地址，
    # 把  <该地址>/notify?token=<你的token>  填到 GitHub 仓库的
    # Secret NOTIFY_URL，token 填到 Secret NOTIFY_TOKEN（可选）。

收到 GitHub Actions 的 POST /notify 后：
  1. Windows 桌面 Toast 弹窗（原生 API，无需第三方库）
  2. 系统提示音
  3. 控制台彩色输出 + 追加写 notify_log.txt
"""

import base64
import json
import os
import subprocess
import sys
import threading
import time
from datetime import datetime
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

try:
    sys.stdout.reconfigure(encoding="utf-8")
except Exception:
    pass

HOST = os.environ.get("NOTIFY_HOST", "127.0.0.1")
PORT = int(os.environ.get("NOTIFY_PORT", "8088"))
TOKEN = os.environ.get("NOTIFY_TOKEN", "")          # 为空 = 不校验
LOGFILE = os.path.join(os.path.dirname(os.path.abspath(__file__)), "notify_log.txt")

HISTORY = []          # 最近 20 条通知
HISTORY_LOCK = threading.Lock()

GREEN, RED, YELLOW, CYAN, DIM, RESET = (
    "\033[92m", "\033[91m", "\033[93m", "\033[96m", "\033[2m", "\033[0m")
if os.name != "nt":
    # Linux/macOS 终端一般支持 ANSI；Windows 10+ 的终端也支持
    pass


def log(msg):
    line = f"[{datetime.now().strftime('%H:%M:%S')}] {msg}"
    print(line, flush=True)
    try:
        with open(LOGFILE, "a", encoding="utf-8") as f:
            f.write(f"[{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}] {msg}\n")
    except Exception:
        pass


def _ps_b64(script):
    return base64.b64encode(script.encode("utf-16le")).decode("ascii")


def clean(s):
    """PowerShell 字符串安全化"""
    return (s or "").replace('"', "'").replace("\n", " ").replace("\r", "").strip()


def win_toast(title, body, ok=True):
    """Windows 原生 Toast。AUMID 用 PowerShell 自身的，免注册。"""
    if os.name != "nt":
        return False
    aid = r"{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\WindowsPowerShell\v1.0\powershell.exe"
    script = f"""
$ErrorActionPreference = 'SilentlyContinue'
[Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType=WindowsRuntime] | Out-Null
$t = [Windows.UI.Notifications.ToastNotificationManager]::GetTemplateContent([Windows.UI.Notifications.ToastTemplateType]::ToastText02)
$nodes = $t.GetElementsByTagName('text')
$nodes.Item(0).AppendChild($t.CreateTextNode('{clean(title)}')) | Out-Null
$nodes.Item(1).AppendChild($t.CreateTextNode('{clean(body)}')) | Out-Null
$n = New-Object Windows.UI.Notifications.ToastNotification($t)
[Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('{aid}').Show($n)
if ($?) {{ 'OK' }} else {{ 'FAIL' }}
"""
    try:
        r = subprocess.run(
            ["powershell", "-NoProfile", "-EncodedCommand", _ps_b64(script)],
            capture_output=True, text=True, timeout=15,
            creationflags=getattr(subprocess, "CREATE_NO_WINDOW", 0))
        return "OK" in (r.stdout or "")
    except Exception as e:
        log(f"{DIM}toast 异常: {e}{RESET}")
        return False


def beep(ok=True):
    if os.name != "nt":
        return
    try:
        import winsound
        winsound.MessageBeep(winsound.MB_ICONASTERISK if ok else winsound.MB_ICONHAND)
    except Exception:
        pass


class Handler(BaseHTTPRequestHandler):
    server_version = "PTSP01Notify/1.0"

    # ---------- 工具 ----------
    def _json(self, code, obj):
        raw = json.dumps(obj, ensure_ascii=False).encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(raw)))
        self.end_headers()
        self.wfile.write(raw)

    def _html(self, code, text):
        raw = text.encode("utf-8")
        self.send_response(code)
        self.send_header("Content-Type", "text/html; charset=utf-8")
        self.send_header("Content-Length", str(len(raw)))
        self.end_headers()
        self.wfile.write(raw)

    def log_message(self, fmt, *args):        # 静默默认访问日志
        pass

    # ---------- 路由 ----------
    def do_GET(self):
        if self.path in ("/", "/status"):
            rows = "".join(
                f"<li>{h['time']} · {h['status']} · {h['title']}" for h in HISTORY[::-1])
            self._html(200, f"""<!doctype html><meta charset="utf-8">
<title>PTSP01 通知监听器</title>
<h2>PTSP01 云编译通知监听器</h2>
<p>监听 <b>{HOST}:{PORT}</b> · 回调路径 <b>/notify</b> · {'已启用 token 校验' if TOKEN else '未设置 token（公开）'}</p>
<p>最近 {len(HISTORY)} 条通知：</p><ul>{rows or '<li>（还没有通知）'}</ul>""")
        elif self.path == "/health":
            self._json(200, {"ok": True, "token": bool(TOKEN), "history": len(HISTORY)})
        else:
            self._json(404, {"error": "not found"})

    def do_POST(self):
        if not self.path.startswith("/notify"):
            self._json(404, {"error": "use POST /notify"})
            return

        # token 校验：query ?token= 或 header X-Notify-Token
        if TOKEN:
            supplied = ""
            if "token=" in self.path:
                supplied = self.path.split("token=", 1)[1].split("&", 1)[0]
            supplied = supplied or self.headers.get("X-Notify-Token", "")
            if supplied != TOKEN:
                log(f"{RED}拒绝: token 不正确，来自 {self.client_address[0]}{RESET}")
                self._json(403, {"error": "bad token"})
                return

        try:
            n = int(self.headers.get("Content-Length", 0))
            data = json.loads(self.rfile.read(n) or b"{}")
        except Exception as e:
            self._json(400, {"error": f"bad json: {e}"})
            return

        status = str(data.get("status", "unknown")).lower()   # success / failure / cancelled
        title = clean(data.get("title") or "OpenWrt 构建")
        body = clean(data.get("body") or "")
        url = data.get("url") or ""
        mins = data.get("minutes")

        ok = status == "success"
        icon = "✅" if ok else ("⚠️" if status == "cancelled" else "❌")
        color = GREEN if ok else (YELLOW if status == "cancelled" else RED)

        # 控制台 + 历史 + 文件
        line = f"{color}{icon} {status.upper():9s}{RESET} {CYAN}{title}{RESET}"
        if body:
            line += f"  {body}"
        if mins is not None:
            line += f"  {DIM}({mins} 分钟){RESET}"
        log(line)
        if url:
            log(f"    {DIM}{url}{RESET}")

        with HISTORY_LOCK:
            HISTORY.append({"time": datetime.now().strftime("%m-%d %H:%M"),
                            "status": status, "title": title})
            del HISTORY[:-20]

        # 弹窗 + 声音（放后台线程，避免拖住 HTTP 响应）
        threading.Thread(target=lambda: (win_toast(f"{icon} {title}",
                                                   body or status, ok), beep(ok)),
                         daemon=True).start()

        self._json(200, {"ok": True, "status": status})


def main():
    log(f"{CYAN}PTSP01 通知监听器启动{RESET}  http://{HOST}:{PORT}")
    log(f"  回调路径: POST /notify    token 校验: {'开启' if TOKEN else '未设置 NOTIFY_TOKEN（任何人可发）'}")
    log(f"  日志文件: {LOGFILE}")
    log(f"{DIM}  下一步: cloudflared tunnel --url http://localhost:{PORT}{RESET}")
    srv = ThreadingHTTPServer((HOST, PORT), Handler)
    try:
        srv.serve_forever()
    except KeyboardInterrupt:
        log("退出")


if __name__ == "__main__":
    main()
